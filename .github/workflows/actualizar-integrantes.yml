name: Actualizar integrantes PC2 (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  documentos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar generadores
        run: |
          python -m pip install python-docx Pillow
          npm install --no-save --package-lock=false pptxgenjs
          if ! command -v libreoffice >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libreoffice-writer libreoffice-impress
          fi
      - name: Generar entregables con roster oficial
        run: python scripts/actualizar_integrantes.py
      - name: Publicar resultados solicitados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ mi-aporte-* presentacion/ scripts/generar_presentacion.cjs
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerar entregables PC2 con roster oficial"
            git push
          fi
