name: Validar integración PC2
on:
  push:
    branches: [rama1, main, 'revision-pc2-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis JavaScript
        run: |
          node --check server.mjs
          node --check public/app.js
          node --check tests/app.test.mjs
      - name: Ejecutar pruebas
        run: npm test
