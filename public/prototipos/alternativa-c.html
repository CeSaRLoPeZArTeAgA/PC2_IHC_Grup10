<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alternativa C · TriageVoz</title><link rel="stylesheet" href="/styles.css"></head><body><main><section class="panel"><span class="eyebrow">PROPUESTA DE DISEÑO C</span><h1>Multimodal integrada</h1><p>Silueta, voz y texto con confirmación editable. Alternativa elegida.</p><p id="progress">Pantalla 1 de 4</p><div id="frame"><h2 id="title">Inicio</h2><p id="description">Revisa la finalidad y activa accesibilidad. Es un flujo ilustrativo, no una evaluación médica.</p></div><div class="actions"><button id="previous">← Anterior</button><button id="next" class="primary">Siguiente →</button></div><p><a href="/">Volver a aplicación principal</a></p></section></main><script>let n=0;const s=[['Inicio','Configuración y ayuda contextual'],['Captura de relato','Silueta, texto o dictado'],['Confirmación','Revisión de datos explícitos y corrección'],['Resumen y envío','Resumen de caso ficticio para revisión profesional']];function r(){document.getElementById('title').textContent=s[n][0];document.getElementById('description').textContent=s[n][1];document.getElementById('progress').textContent='Pantalla '+(n+1)+' de 4'}document.getElementById('next').onclick=()=>{n=(n+1)%4;r()};document.getElementById('previous').onclick=()=>{n=(n+3)%4;r()};r()</script></body></html>
